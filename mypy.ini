[mypy]
# `tests/` imports `scripts.dump_grills`, while mypy walking the tree would
# otherwise also see that file as a top-level `dump_grills` and refuse the
# duplicate. `scripts/` has no `__init__.py` on purpose -- adding one would
# make setuptools package and ship it -- so name the repo root as the package
# base instead.
explicit_package_bases = True
mypy_path = .

[mypy-dukpy.*]
ignore_missing_imports = True
