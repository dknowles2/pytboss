[build-system]
requires      = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name            = "pytboss"
description     = "Python library for interacting with PitBoss grills and smokers."
authors         = [
    {name = "David Knowles", email = "dknowles2@gmail.com"},
]
dependencies    = ["aiohttp", "bleak", "bleak_retry_connector", "dukpy", "mypy_extensions"]
requires-python = ">=3.12"
dynamic         = ["readme", "version"]
license         = {text = "Apache License 2.0"}
keywords        = ["pitboss", "api", "iot", "ble"]
classifiers     = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
"Homepage"      = "https://github.com/dknowles2/pytboss"
"Source Code"   = "https://github.com/dknowles2/pytboss"
"Bug Reports"   = "https://github.com/dknowles2/pytboss/issues"

[tool.setuptools]
platforms            = ["any"]
zip-safe             = true
include-package-data = true

[tool.setuptools.dynamic]
readme          = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.packages.find]
# where = ["."]
# include = ["pytboss"]
exclude = ["fake_firmware"]

[tool.setuptools_scm]
write_to = "pytboss/_version.py"

[tool.ruff]
# Stated rather than inferred. `ruff format` decides where to wrap from
# `line-length`, so CI and a local run have to agree on it, and the target
# version is otherwise derived from `requires-python` at a distance.
#
# Deliberately no `[tool.ruff.lint] select`: ruff's default set is much wider
# than the `E4, E7, E9, F` the docs describe -- it includes BLE, B, S, ASYNC
# and more, which is why `# noqa: BLE001` appears in this tree at all. Naming
# a narrower set here would silently switch rules off.
line-length    = 88
target-version = "py312"

[tool.uv]
default-groups = []

[dependency-groups]
test = [
    "freezegun==1.5.5",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-aiohttp==1.1.1",
    "ruff==0.16.0",
]
dev = [
    {include-group = "test"},
    "pre-commit==4.6.1",
]
