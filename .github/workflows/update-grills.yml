name: Update grills.json

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  update-grills-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked --group dev

      - name: Write API credentials
        env:
          PITBOSS_USERNAME: ${{ secrets.PITBOSS_USERNAME }}
          PITBOSS_PASSWORD: ${{ secrets.PITBOSS_PASSWORD }}
        run: |
          if [[ -z "$PITBOSS_USERNAME" || -z "$PITBOSS_PASSWORD" ]]; then
            echo "::error::The PITBOSS_USERNAME and PITBOSS_PASSWORD secrets must be set."
            echo "::error::The Dansons API has required authentication since Oct 2025."
            exit 1
          fi
          umask 077
          printf '[pitboss]\nusername = %s\npassword = %s\n' \
            "$PITBOSS_USERNAME" "$PITBOSS_PASSWORD" >"$HOME/.pitboss"

      - name: Run dump_grills.py
        id: run-script
        run: |
          GRILLS_JSON="pytboss/grills.json"
          TMP_JSON="$(mktemp)"
          trap 'rm -f "$TMP_JSON"' EXIT

          echo "Running scripts/dump_grills.py"
          # Dump to a temporary file first. Redirecting straight onto
          # grills.json truncates it before the script runs, so a mid-run
          # failure would commit empty definitions.
          uv run --no-sync python -m scripts.dump_grills >"$TMP_JSON"
          mv "$TMP_JSON" "$GRILLS_JSON"

          if git diff --quiet -- "$GRILLS_JSON"; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove API credentials
        if: always()
        run: rm -f "$HOME/.pitboss"

      - name: Create PR
        id: create-pr
        if: steps.run-script.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BOT_PAT }}
          commit-message: "Automated: Update grills.json"
          title: "Automated: Update grills.json"
          body: |
            Update grills.json with the latest definitions.

            Newly added models sometimes ship parsing routines that fail the
            test suite, so check CI before merging rather than assuming a
            definitions-only change is safe.

            This PR was automatically generated by a GitHub Action.
          push-to-fork: dknowles-bot/pytboss
          base: main
          branch: grills-json-${{ github.run_number }}
          delete-branch: true
          labels: enhancement
