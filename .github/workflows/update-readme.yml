name: Update README.md

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked

      - name: Run README update script
        run: uv run --no-sync python scripts/update_readme.py

      # The Main ruleset requires a pull request, so this cannot commit to the
      # default branch directly. Opening one under BOT_PAT rather than
      # GITHUB_TOKEN also matters: pull requests created with GITHUB_TOKEN do
      # not trigger further workflows, so build/mypy/ruff would never report
      # and the required checks could never be satisfied.
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BOT_PAT }}
          commit-message: "Automated: Update README.md"
          title: "Automated: Update README.md"
          body: |
            Regenerate the supported models list from the current grill
            definitions.

            This PR was automatically generated by a GitHub Action.
          push-to-fork: dknowles-bot/pytboss
          base: main
          branch: readme-${{ github.run_number }}
          delete-branch: true
          add-paths: README.md
